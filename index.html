    'wipe': () => {
      if (!confirm('Na pewno usunąć WSZYSTKIE dane (uczniów, lekcje, wpłaty)? Tej operacji nie można cofnąć.')) return;
      if (!confirm('Ostatnie pytanie: czy masz kopię zapasową? Kliknij OK, aby usunąć dane.')) return;
      state = DEFAULT_STATE(); save(); location.hash = '#/pulpit'; render(); toast('Usunięto wszystkie dane.');
    },
  };
  function copyText(text) {
    const done = () => toast('Skopiowano do schowka.');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    (dlg().open ? dlg() : document.body).appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Zaznacz tekst i skopiuj ręcznie.', 'bad'); }
    ta.remove();
  }
  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || ''); el.setAttribute('role', 'status'); el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, kind === 'bad' ? 5200 : 3200);
  }

  /* ================= Events ================= */
  document.addEventListener('click', (e) => {
    const link = e.target.closest('[data-msg-link]');
    if (link) {
      e.preventDefault();
      const text = $('#msg') ? $('#msg').value : '';
      const k = link.dataset.msgLink;
      if (k === 'sms') location.href = `sms:${link.dataset.phone}${/iPhone|iPad|Mac/.test(navigator.userAgent) ? '&' : '?'}body=${encodeURIComponent(text)}`;
      if (k === 'wa') window.open(`https://wa.me/${link.dataset.phone}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
      if (k === 'mail') location.href = `mailto:${link.dataset.email}?subject=${encodeURIComponent('Zajęcia – ' + (S().name || 'korepetycje'))}&body=${encodeURIComponent(text)}`;
      return;
    }
    const a = e.target.closest('[data-action]');
    if (!a || a.disabled) return;
    const fn = actions[a.dataset.action];
    if (!fn) return;
    if (a.tagName === 'A') e.preventDefault();
    fn(Object.assign({}, a.dataset), e, a);
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('.modal-form'); if (!f) return;
    e.preventDefault();
    if (modalSubmit) modalSubmit(formData(f));
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'student-q') {
      ui.studentQuery = el.value;
      const pos = el.selectionStart; render(true);
      const n = $('#student-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } }
      return;
    }
    if (el.dataset.setting) {
      const k = el.dataset.setting;
      let v = el.value;
      if (['defaultRate', 'defaultDuration', 'billNext'].includes(k)) v = num(v);
      S()[k] = v; saveSoon();
      if (k === 'theme') applyTheme();
      return;
    }
    if (el.dataset.template) { S().templates[el.dataset.template] = el.value; saveSoon(); return; }
    if (el.dataset.limit) { S().limits[el.dataset.limit] = el.value === '' ? '' : num(el.value); saveSoon(); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.workday != null) {
      const days = $$('[data-workday]').filter((x) => x.checked).map((x) => Number(x.dataset.workday));
      S().workDays = days; save(); return;
    }
    if (el.dataset.setting === 'mode') { save(); return; }
    if (el.id === 'fin-year') { ui.finYear = Number(el.value); render(true); return; }
    if (el.id === 'pay-month') { ui.payMonth = el.value; render(true); return; }
    if (el.id === 'file-import' && el.files[0]) { importBackup(el.files[0]); el.value = ''; }
  });
  dlg().addEventListener('close', () => { modalSubmit = null; });
  dlg().addEventListener('click', (e) => { if (e.target === dlg()) closeModal(); });
  window.addEventListener('hashchange', () => { closeModal(); render(); });
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY && e.newValue) { try { state = migrate(JSON.parse(e.newValue)); render(true); } catch (x) { /* ignore */ } } });
  let lastNarrow = window.matchMedia('(max-width: 760px)').matches;
  window.addEventListener('resize', debounce(() => { const n = window.matchMedia('(max-width: 760px)').matches; if (n !== lastNarrow && route().name === 'kalendarz') render(true); lastNarrow = n; }, 150));
  // Odśwież co minutę (linia „teraz”, lekcje do potwierdzenia), ale nie w trakcie edycji.
  setInterval(() => { if (!dlg().open && !document.activeElement.matches('input, textarea, select')) render(true); }, 60000);

  /* ================= Demo ================= */
  function makeDemo() {
    const s = DEFAULT_STATE();
    s.settings.name = 'Anna Nowak (przykład)';
    s.settings.email = 'anna@example.com';
    s.settings.defaultRate = 90;
    s.settings.workStart = '14:00'; s.settings.workEnd = '20:00';
    const t = todayISO(); const td = dow(t);
    const mk = (name, subject, level, rate, duration, color, contact) => ({ id: uid(), name, subject, level, rate, duration, color, contactName: contact, phone: '', email: '', address: '', notes: '', active: true, createdAt: Date.now() });
    const ola = mk('Ola Kowalska', 'matematyka', '8 klasa', 80, 60, COLORS[0], 'Mama Oli');
    const kuba = mk('Kuba Wiśniewski', 'fizyka', 'matura rozszerzona', 100, 90, COLORS[2], 'Tata Kuby');
    const zosia = mk('Zosia Mazur', 'język angielski', '5 klasa', 80, 45, COLORS[3], 'Pani Mazur');
    const antek = mk('Antek Pawlak', 'matematyka', 'matura podstawowa', 90, 60, COLORS[1], 'Antek (pełnoletni)');
    const maja = mk('Maja Lis', 'chemia', '1 LO', 85, 60, COLORS[4], 'Mama Mai');
    ola.notes = 'Cel: egzamin ósmoklasisty na 80%+. Słabiej: zadania tekstowe, geometria.';
    kuba.notes = 'Matura 2027, cel: politechnika. Lekcje 2× w tygodniu.';
    s.students = [ola, kuba, zosia, antek, maja];
    const topics = {
      matematyka: ['Równania liniowe', 'Procenty w zadaniach', 'Pola figur', 'Twierdzenie Pitagorasa', 'Funkcja liniowa', 'Układy równań', 'Potęgi i pierwiastki', 'Zadania tekstowe', 'Statystyka', 'Graniastosłupy'],
      fizyka: ['Kinematyka – rzuty', 'Dynamika – zasady Newtona', 'Praca i energia', 'Pęd i zderzenia', 'Ruch po okręgu', 'Grawitacja', 'Drgania', 'Fale', 'Termodynamika', 'Elektrostatyka'],
      'język angielski': ['Present Simple vs Continuous', 'Słownictwo: dom', 'Past Simple', 'Czytanie ze zrozumieniem', 'Słownictwo: jedzenie', 'Opis obrazka', 'Going to', 'Stopniowanie przymiotników'],
      chemia: ['Budowa atomu', 'Układ okresowy', 'Wiązania chemiczne', 'Reakcje chemiczne', 'Mol i masa molowa', 'Stechiometria', 'Roztwory', 'Stężenia procentowe'],
    };
    const plan = [
      { st: ola, day: td, time: '16:00' },
      { st: kuba, day: td, time: '17:30' },
      { st: kuba, day: (td + 3) % 7, time: '18:00' },
      { st: zosia, day: (td + 1) % 7, time: '15:00' },
      { st: antek, day: (td + 6) % 7, time: '18:00' },
      { st: maja, day: (td + 2) % 7, time: '16:30' },
    ];
    const ws = mondayOf(t);
    plan.forEach((p, pi) => {
      const seriesId = uid();
      let ti = 0;
      for (let w = -9; w <= 6; w++) {
        const d = addDays(ws, w * 7 + p.day);
        const l = { id: uid(), studentId: p.st.id, date: d, time: p.time, duration: p.st.duration, price: priceFor(p.st.rate, p.st.duration), status: 'planned', topic: '', homework: '', notes: '', seriesId, createdAt: Date.now() };
        if (d < t) {
          l.status = 'done';
          const tp = topics[p.st.subject] || topics.matematyka; l.topic = tp[ti++ % tp.length];
          if (Math.random() < 0.5) l.homework = 'Zadania ' + (2 + (ti % 5)) + '–' + (6 + (ti % 5)) + ' ze zbioru';
          if ((w === -5 && pi === 3) || (w === -3 && pi === 5)) { l.status = 'cancelled'; l.topic = ''; l.homework = ''; }
          if (w === -2 && pi === 1) { l.status = 'late'; l.topic = ''; l.homework = ''; l.notes = 'Odwołane godzinę przed zajęciami.'; }
        }
        if (d === addDays(t, -1) && pi === 4) { l.status = 'planned'; l.topic = ''; l.homework = ''; }
        s.lessons.push(l);
      }
    });
    if (!s.lessons.some((l) => l.date === addDays(t, -1) && l.status === 'planned')) {
      s.lessons.push({ id: uid(), studentId: antek.id, date: addDays(t, -1), time: '19:00', duration: 60, price: 90, status: 'planned', topic: '', homework: '', notes: 'Lekcja dodatkowa przed sprawdzianem', seriesId: null, createdAt: Date.now() });
    }
    const charged = (st, from, to) => s.lessons.filter((l) => l.studentId === st.id && STATUS[l.status].charged && l.date >= from && l.date <= to);
    const pay = (st, date, amount, method, note) => s.payments.push({ id: uid(), studentId: st.id, date, amount: round2(amount), method, note: note || '', createdAt: Date.now() });
    // Ola – płaci gotówką po lekcji, ale dwie ostatnie nieopłacone
    charged(ola, '0000', t).slice(0, -2).forEach((l) => pay(ola, l.date, l.price, 'cash'));
    // Kuba – przelew na początku miesiąca za cały poprzedni miesiąc
    const months = Array.from(new Set(charged(kuba, '0000', t).map((l) => l.date.slice(0, 7)))).sort();
    months.forEach((m) => { const [f, to] = monthRange(m); if (addDays(to, 3) > t) return; const sum = charged(kuba, f, to).reduce((a, l) => a + l.price, 0); pay(kuba, addDays(to, 3), sum, 'transfer', 'Za ' + monthLabel(m)); });
    // Zosia – pakiet 4 lekcji z góry (BLIK)
    const zl = charged(zosia, '0000', t);
    for (let i = 0; i < zl.length + 2; i += 4) pay(zosia, (zl[i] || zl[zl.length - 1]).date, 4 * priceFor(80, 45), 'blik', 'Pakiet 4 lekcji');
    // Antek – zalega z kilkoma lekcjami
    charged(antek, '0000', t).slice(0, -3).forEach((l) => pay(antek, l.date, l.price, 'blik'));
    // Maja – rozliczona
    charged(maja, '0000', t).forEach((l) => pay(maja, l.date, l.price, 'cash'));
    s.expenses.push({ id: uid(), date: addDays(t, -40), amount: 49.9, category: 'Materiały i książki', note: 'Zbiór zadań maturalnych z fizyki' });
    s.expenses.push({ id: uid(), date: addDays(t, -20), amount: 89, category: 'Sprzęt', note: 'Tablet graficzny (lekcje online)' });
    s.expenses.push({ id: uid(), date: addDays(t, -6), amount: 24.99, category: 'Materiały i książki', note: 'Karty pracy – angielski' });
    s.settings.lastBackup = Date.now();
    return s;
  }

  /* ================= Start ================= */
  function init() {
    $('#app-logo').innerHTML = LOGO;
    $('#app-version').textContent = 'Kreda ' + VERSION + (IS_DEMO ? ' · demo' : '');
    if (IS_DEMO && !SHOT) $('#demo-side').classList.remove('hide');
    if (SHOT === 'student') { const a = state.students.find((x) => x.name.startsWith('Antek')); if (a) location.hash = '#/uczen/' + a.id; }
    if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ } }
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel=manifest]')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    render();
    if (SHOT === 'remind') { const d = debtors().find((x) => x.s.name.startsWith('Antek')) || debtors()[0]; if (d) remindPayment(d.s.id); }
    if (SHOT === 'confirmed') { toConfirmList().forEach((l) => { l.status = 'done'; }); render(); }
  }
  init();
})();

</script>
